<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTools - المنصة الشاملة للأدوات اليومية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #020617;
            --accent-blue: #0284c7;
            --accent-dark: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(56, 189, 248, 0.15);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.12) 0%, transparent 70%);
            top: -50px; right: -50px;
            z-index: 0;
        }

        .main-container {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 26px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .circle-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .circle-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-muted);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .circle-btn:hover {
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .circle-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: #38bdf8;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        .tool-panel {
            display: none;
            flex-direction: column;
            gap: 14px;
            animation: smoothFade 0.3s ease;
        }

        .tool-panel.active {
            display: flex;
        }

        @keyframes smoothFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 700;
            padding-right: 2px;
        }

        .custom-input, .custom-select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-input:focus, .custom-select:focus {
            border-color: var(--accent-blue);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: var(--accent-blue);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .result-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-top: 5px;
        }

        .result-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 4px;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            color: #38bdf8;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
        }

        .btn-sub {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(30, 41, 59, 0.5);
            color: #fff;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="glass-card">
        <div class="header-title">
            <div class="brand-logo">OmniTools</div>
            <div class="brand-subtitle">حلول رقمية وأدوات يومية لمضاعفة إنتاجيتك</div>
        </div>

        <div class="circle-nav">
            <button class="circle-btn active" title="حاسبة السعرات" onclick="switchTab('calories', this)">🔥</button>
            <button class="circle-btn" title="كلمات المرور" onclick="switchTab('passwords', this)">🔐</button>
            <button class="circle-btn" title="مؤقت التركيز" onclick="switchTab('pomodoro', this)">⏱️</button>
            <button class="circle-btn" title="الملاحظات السريعة" onclick="switchTab('notes', this)">📝</button>
        </div>

        <!-- 1. Calories -->
        <div id="calories" class="tool-panel active">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label class="input-label">الوزن (كجم)</label>
                    <input type="number" id="weight" class="custom-input" placeholder="70">
                </div>
                <div class="input-group">
                    <label class="input-label">الطول (سم)</label>
                    <input type="number" id="height" class="custom-input" placeholder="175">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label class="input-label">العمر</label>
                    <input type="number" id="age" class="custom-input" placeholder="25">
                </div>
                <div class="input-group">
                    <label class="input-label">الجنس</label>
                    <select id="gender" class="custom-select">
                        <option value="male">ذكر</option>
                        <option value="female">أنثى</option>
                    </select>
                </div>
            </div>
            <button class="btn-action" onclick="playPopSound(); calculateCalories();">احسب السعرات اليومية</button>
            <div class="result-box" id="calorieResult" style="display:none;">
                <div style="font-size:0.8rem; color:var(--text-muted);">المعدل اليومي المقترح:</div>
                <div class="result-value" id="calorieValue">0 سعرة</div>
            </div>
        </div>

        <!-- 2. Passwords -->
        <div id="passwords" class="tool-panel">
            <div class="input-group">
                <label class="input-label">طول كلمة المرور</label>
                <input type="number" id="passLength" class="custom-input" value="12" min="6" max="32">
            </div>
            <button class="btn-action" onclick="playPopSound(); generatePassword();">توليد كلمة مرور معقدة</button>
            <div class="result-box" id="passResult" style="display:none;">
                <div class="result-value" id="passValue" style="font-size:1.1rem; word-break:break-all;">---</div>
                <button class="btn-sub" style="margin-top:10px; width:100%;" onclick="playPopSound(); copyPassword();">📋 نسخ</button>
            </div>
        </div>

        <!-- 3. Pomodoro Timer -->
        <div id="pomodoro" class="tool-panel">
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button class="btn-sub" onclick="playPopSound(); startTimer();">بدء</button>
                <button class="btn-sub" onclick="playPopSound(); pauseTimer();">إيقاف</button>
                <button class="btn-sub" onclick="playPopSound(); resetTimer();">إعادة</button>
            </div>
        </div>

        <!-- 4. Quick Notes -->
        <div id="notes" class="tool-panel">
            <div class="input-group">
                <label class="input-label">الملاحظات السريعة (تحفظ تلقائياً في جهازك)</label>
                <textarea id="quickNote" class="custom-input" style="height: 120px; resize: none;" placeholder="اكتب ملاحظاتك هنا..." oninput="saveNote()"></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    function playPopSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(550, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.04);
            
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
        } catch(e) {}
    }

    function switchTab(tabId, element) {
        playPopSound();
        document.querySelectorAll('.circle-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tool-panel').forEach(panel => panel.classList.remove('active'));
        
        element.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function calculateCalories() {
        const w = parseFloat(document.getElementById('weight').value);
        const h = parseFloat(document.getElementById('height').value);
        const a = parseFloat(document.getElementById('age').value);
        const gender = document.getElementById('gender').value;

        if(!w || !h || !a) return;

        let bmr = (10 * w) + (6.25 * h) - (5 * a);
        bmr = gender === 'male' ? bmr + 5 : bmr - 161;
        const totalCalories = Math.round(bmr * 1.35);

        document.getElementById('calorieValue').innerText = `${totalCalories} سعرة`;
        document.getElementById('calorieResult').style.display = 'block';
    }

    function generatePassword() {
        const len = parseInt(document.getElementById('passLength').value) || 12;
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
        let pass = "";
        for (let i = 0; i < len; i++) {
            pass += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('passValue').innerText = pass;
        document.getElementById('passResult').style.display = 'block';
    }

    function copyPassword() {
        const pass = document.getElementById('passValue').innerText;
        navigator.clipboard.writeText(pass);
    }

    let timer = null;
    let timeLeft = 25 * 60;

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    function startTimer() {
        if(timer) return;
        timer = setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
            } else {
                clearInterval(timer);
                timer = null;
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timer);
        timer = null;
    }

    function resetTimer() {
        pauseTimer();
        timeLeft = 25 * 60;
        updateTimerDisplay();
    }

    const noteArea = document.getElementById('quickNote');
    if(noteArea) {
        noteArea.value = localStorage.getItem('omni_note') || '';
    }

    function saveNote() {
        localStorage.setItem('omni_note', noteArea.value);
    }
</script>

</body>
</html>
